<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gun art preview</title>
<style>
  body{background:#0a0c12;margin:0;padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:820px}
  img{width:100%;display:block;border-radius:8px}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="gunart.js"></script>
<script>
for(const t of [1,2,3,4,5,11,12,13,14,15]){
  const img=document.createElement("img");
  img.src=gunArtURI(+t, t>=11?t-10:42, {label:true});
  document.body.appendChild(img);
}
</script>
</body>
</html>
